<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Match Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎾 Tennis Match Tracker</h1>
            <p class="subtitle">Track your matches and analyze your performance</p>
        </header>

        <!-- Stats Dashboard -->
        <div class="stats-container" id="statsContainer">
            <div class="stat-card">
                <div class="stat-value" id="totalMatches">0</div>
                <div class="stat-label">Total Matches</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="wins">0</div>
                <div class="stat-label">Wins</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="losses">0</div>
                <div class="stat-label">Losses</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="winPercentage">0%</div>
                <div class="stat-label">Win Rate</div>
            </div>
        </div>

        <!-- Recent Form -->
        <div class="recent-form" id="recentForm"></div>

        <!-- Add Match Form -->
        <div class="form-container">
            <h2>Log New Match</h2>
            <form id="matchForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date" required>
                    </div>
                    <div class="form-group">
                        <label for="opponent">Opponent</label>
                        <input type="text" id="opponent" name="opponent" placeholder="Opponent name" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="yourScore">Your Score</label>
                        <input type="number" id="yourScore" name="your_score" min="0" max="7" required>
                    </div>
                    <div class="form-group">
                        <label for="opponentScore">Opponent Score</label>
                        <input type="number" id="opponentScore" name="opponent_score" min="0" max="7" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="surface">Surface</label>
                        <select id="surface" name="surface" required>
                            <option value="">Select surface</option>
                            <option value="Hard Court">Hard Court</option>
                            <option value="Clay">Clay</option>
                            <option value="Grass">Grass</option>
                            <option value="Carpet">Carpet</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="matchType">Match Type</label>
                        <select id="matchType" name="match_type" required>
                            <option value="">Select type</option>
                            <option value="Practice">Practice</option>
                            <option value="Tournament">Tournament</option>
                            <option value="League">League</option>
                            <option value="Friendly">Friendly</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="notes">Notes (Optional)</label>
                    <textarea id="notes" name="notes" rows="3" placeholder="Match notes, key moments, areas to improve..."></textarea>
                </div>

                <button type="submit" class="btn-primary">Add Match</button>
            </form>
        </div>

        <!-- Surface Stats -->
        <div class="surface-stats-container" id="surfaceStatsContainer">
            <h2>Performance by Surface</h2>
            <div id="surfaceStats" class="surface-stats"></div>
        </div>

        <!-- Match History -->
        <div class="matches-container">
            <h2>Match History</h2>
            <div id="matchesList" class="matches-list"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
